<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Project Command</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">
  <link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>MILLIONAIRE GROUP OF COMPANIES</h1>
      <p>Project Command &nbsp;|&nbsp; Authorised users only</p>
    </div>
  </header>
  <main class="dashboard">
    <section class="add-project" style="max-width:420px;margin:0 auto;">
      <h2>Sign In</h2>
      <form id="login-form" style="display:grid;gap:14px;">
        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
      <p id="login-message" class="note"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    const cfg = window.PROJECT_COMMAND_CONFIG;
    const db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { email, password } = Object.fromEntries(new FormData(e.target).entries());
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (!error) {
        window.location.href = "index.html";
      } else {
        document.getElementById("login-message").textContent = "Sign in failed: " + error.message;
      }
    });
  </script>
</body>
</html>
